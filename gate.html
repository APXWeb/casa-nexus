<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>CASA NEXUS — prova de qualidade 3D</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e0f10; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; left: 10px; top: 10px; color: #e9e6df; background: rgba(0,0,0,.55); padding: 6px 9px; white-space: pre; border-radius: 4px; }
      #ui { position: fixed; left: 10px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 90vw; }
      #ui button { background: rgba(20,20,20,.7); color: #eee; border: 1px solid #555; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
      #status { position: fixed; right: 12px; top: 10px; color: #ddd; }
      .shot #hud, .shot #ui, .shot #status { display: none; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="hud"></div>
    <div id="status"></div>
    <div id="ui"></div>
    <script type="module" src="/src/gate.js"></script>
  </body>
</html>
